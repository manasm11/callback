name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compute build version
        id: version
        run: |
          BASE_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION_NAME="${BASE_VERSION}-${{ github.run_number }}-${SHORT_SHA}"
          echo "Building version: $VERSION_NAME (code ${{ github.run_number }})"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=${{ steps.version.outputs.version_name }} \
            --console=plain

      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/callback-tracker-${{ steps.version.outputs.version_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: callback-tracker-${{ steps.version.outputs.version_name }}
          path: dist/*.apk

      - name: Purge old APK artifacts (keep newest 10)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keep = 10;
            const prefix = "callback-tracker-";

            let artifacts = [];
            let page = 1;
            for (;;) {
              const res = await github.rest.actions.listArtifactsForRepo({
                owner, repo, per_page: 100, page,
              });
              if (res.data.artifacts.length === 0) break;
              artifacts.push(...res.data.artifacts);
              page++;
            }

            const matching = artifacts
              .filter((a) => a.name.startsWith(prefix) && !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const toDelete = matching.slice(keep);
            for (const artifact of toDelete) {
              console.log(
                `Deleting artifact ${artifact.name} (id ${artifact.id}, created ${artifact.created_at})`
              );
              await github.rest.actions.deleteArtifact({
                owner, repo, artifact_id: artifact.id,
              });
            }
            console.log(
              `Kept ${Math.min(matching.length, keep)} of ${matching.length} matching artifacts, deleted ${toDelete.length}.`
            );
