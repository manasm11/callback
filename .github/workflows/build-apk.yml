name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run sync server tests
        run: python3 -m unittest discover -s server -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compute build version
        id: version
        run: |
          # app/build.gradle.kts' default versionName falls back to "1.0" (see
          # its `?: "1.0"` in defaultConfig) when appVersionName isn't passed in;
          # CI always passes appVersionName below, so this is just the base prefix.
          BASE_VERSION="1.0"
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION_NAME="${BASE_VERSION}-${{ github.run_number }}-${SHORT_SHA}"
          echo "Building version: $VERSION_NAME (code ${{ github.run_number }})"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          # Fail rather than silently sign with a random key: such an APK can't
          # be installed over the previous one without uninstalling (and losing data).
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew :app:assembleDebug \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=${{ steps.version.outputs.version_name }} \
            --console=plain

      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/callback-tracker-${{ steps.version.outputs.version_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: callback-tracker-${{ steps.version.outputs.version_name }}
          path: dist/*.apk

      - name: Create GitHub Release with APK attached
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version_name }}" \
            "dist/callback-tracker-${{ steps.version.outputs.version_name }}.apk" \
            --target "${{ github.sha }}" \
            --title "callback-tracker ${{ steps.version.outputs.version_name }}" \
            --notes "Automated build from commit ${{ github.sha }}."

      - name: Purge old releases (keep newest 10)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r tag; do
                echo "Deleting release $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done

      - name: Purge old APK artifacts (keep newest 10)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keep = 10;
            const prefix = "callback-tracker-";

            let artifacts = [];
            let page = 1;
            for (;;) {
              const res = await github.rest.actions.listArtifactsForRepo({
                owner, repo, per_page: 100, page,
              });
              if (res.data.artifacts.length === 0) break;
              artifacts.push(...res.data.artifacts);
              page++;
            }

            const matching = artifacts
              .filter((a) => a.name.startsWith(prefix) && !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const toDelete = matching.slice(keep);
            for (const artifact of toDelete) {
              console.log(
                `Deleting artifact ${artifact.name} (id ${artifact.id}, created ${artifact.created_at})`
              );
              await github.rest.actions.deleteArtifact({
                owner, repo, artifact_id: artifact.id,
              });
            }
            console.log(
              `Kept ${Math.min(matching.length, keep)} of ${matching.length} matching artifacts, deleted ${toDelete.length}.`
            );
